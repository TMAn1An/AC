<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>NEW Walkthrough Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/logo.js"></script>
<style>
/* Studio for the client walkthrough video, 1920 x 1080. The five real prototype apps run in iframes; a script drives them. */
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
.top { position: absolute; left: 0; right: 0; top: 0; height: 84px; display: flex; align-items: center; justify-content: space-between; padding: 0 56px; }
.logo { display: flex; gap: 14px; align-items: center; font-family: var(--f-display); font-weight: 700; font-size: 34px; letter-spacing: -.02em; } .mk { width: 46px; height: 46px; border-radius: 13px; background: var(--deep); color: var(--accent); display: grid; place-items: center; }
#step { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 18px; color: var(--ink-3); background: #fff; padding: 10px 20px; border-radius: 99px; border: 1px solid var(--line); }
#area { position: absolute; left: 0; right: 0; top: 96px; height: 790px; }
.dev { position: absolute; left: 0; top: 0; transform-origin: top left; transition: transform .7s cubic-bezier(.2,.8,.2,1), opacity .5s; opacity: 0; pointer-events: none; }
.dev.on { opacity: 1; pointer-events: auto; }
.browser { width: 1140px; height: 760px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 50px rgba(21,24,88,.2); display: flex; flex-direction: column; } .browser .chrome { height: 38px; background: #F3F5FA; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 14px; } .browser .chrome i { width: 10px; height: 10px; border-radius: 50%; background: #CDD2E3; } .browser .chrome span { margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 3px 40px; font-size: 12px; color: var(--ink-3); } .browser iframe { flex: 1; border: 0; width: 100%; }
.phone { width: 390px; height: 800px; border: 10px solid #0A0B10; border-radius: 48px; overflow: hidden; background: var(--bg); box-sizing: content-box; box-shadow: 0 20px 50px rgba(21,24,88,.25); } .phone iframe { border: 0; width: 390px; height: 800px; display: block; }
.lab { position: absolute; left: 0; right: 0; top: 100%; margin-top: 10px; text-align: center; font-weight: 700; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
#cap { position: absolute; left: 56px; right: 56px; bottom: 40px; height: 150px; background: var(--deep); color: #fff; border-radius: 28px; display: flex; align-items: center; padding: 0 44px; gap: 28px; box-shadow: 0 16px 40px rgba(21,24,88,.3); }
#cap .bar { width: 8px; align-self: stretch; margin: 28px 0; border-radius: 4px; background: var(--accent); } #cap b { display: block; font-family: var(--f-display); font-size: 42px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; } #cap span { display: block; color: #B9BDE8; font-size: 26px; margin-top: 6px; }
#cap.swap b, #cap.swap span { animation: capIn .5s both; } @keyframes capIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
#title { position: absolute; inset: 0; background: var(--deep); color: #fff; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 22px; z-index: 50; } #title.on { display: flex; animation: capIn .6s both; }
#title h1 { font-size: 112px; letter-spacing: -.04em; color: #fff; max-width: 1500px; } #title p { font-size: 40px; color: #B9BDE8; max-width: 1300px; } #title .mk2 { width: 120px; height: 120px; border-radius: 34px; background: var(--accent); color: var(--deep); display: grid; place-items: center; }
#title .apps { display: flex; gap: 20px; margin-top: 18px; } #title .apps span { background: rgba(255,255,255,.1); border-radius: 18px; padding: 18px 28px; font-size: 28px; font-weight: 600; }
#cur { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -6px 0 0 -6px; z-index: 99; pointer-events: none; transition: transform .6s cubic-bezier(.3,.7,.2,1); }
#cur svg { filter: drop-shadow(0 3px 5px rgba(0,0,0,.35)); } #cur i { position: absolute; left: -14px; top: -14px; width: 40px; height: 40px; border-radius: 50%; border: 4px solid var(--accent); opacity: 0; } #cur.fx i { animation: fx .5s; } @keyframes fx { from { transform: scale(.4); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
.mk, .mk2 { background: #fff !important; display: grid; place-items: center; } .mk svg, .mk2 svg { display: block; }
</style>
</head>
<body>
<div class="top"><div class="logo"><span class="mk" id="mkL"></span>NEW</div><div id="step"></div></div>
<div id="area"></div>
<div id="cap"><div class="bar"></div><div><b id="capA"></b><span id="capB"></span></div></div>
<div id="title"><div class="mk2" id="mkL2"></div><h1 id="tA"></h1><p id="tB"></p><div class="apps" id="tC"></div></div>
<div id="cur"><i></i><svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z" fill="#1E1B18" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<script>
const KIND = { admin: ['Admin web app', 'admin/index.html', 1140, 760 + 0], adminapp: ['Admin app', 'admin-app/index.html', 410, 820], vendor: ['Vendor app', 'vendor/index.html', 410, 820], technician: ['Technician app', 'technician/index.html', 410, 820], customer: ['Customer app', 'customer/index.html', 410, 820] };
document.getElementById('mkL').innerHTML = AC.logo.mark(36); document.getElementById('mkL2').innerHTML = AC.logo.mark(92);
const area = document.getElementById('area'), dev = {};
Object.entries(KIND).forEach(([k, v]) => {
  const d = document.createElement('div'); d.className = 'dev'; d.id = 'd-' + k;
  d.innerHTML = (k === 'admin' ? `<div class="browser"><div class="chrome"><i></i><i></i><i></i><span>admin.new.app</span></div><iframe id="f-${k}" src="../${v[1]}"></iframe></div>` : `<div class="phone"><iframe id="f-${k}" src="../${v[1]}"></iframe></div>`) + `<div class="lab">${v[0]}</div>`;
  area.appendChild(d); dev[k] = d;
});
window.V = {
  show(kinds) {
    const gap = 56, sizes = kinds.map(k => KIND[k]), W = sizes.reduce((a, s) => a + s[2], 0) + gap * (kinds.length - 1), H = Math.max(...sizes.map(s => s[3]));
    const s = Math.min(1, 1808 / W, 740 / H); let x = (1920 - W * s) / 2;
    Object.keys(dev).forEach(k => { if (!kinds.includes(k)) dev[k].classList.remove('on'); });
    kinds.forEach((k, i) => { const d = dev[k], z = KIND[k], y = (770 - z[3] * s) / 2 + 6; d.style.transform = `translate(${x}px, ${y}px) scale(${s})`; d.classList.add('on'); x += (z[2] + gap) * s; });
  },
  cap(a, b) { const c = document.getElementById('cap'); c.classList.remove('swap'); void c.offsetWidth; document.getElementById('capA').textContent = a; document.getElementById('capB').textContent = b || ''; c.classList.add('swap'); },
  step(t) { document.getElementById('step').textContent = t; },
  title(a, b, apps) { document.getElementById('tA').textContent = a; document.getElementById('tB').textContent = b || ''; document.getElementById('tC').innerHTML = (apps || []).map(x => `<span>${x}</span>`).join(''); document.getElementById('title').classList.add('on'); },
  untitle() { document.getElementById('title').classList.remove('on'); },
  cursor(x, y) { document.getElementById('cur').style.transform = `translate(${x}px, ${y}px)`; },
  fx() { const c = document.getElementById('cur'); c.classList.remove('fx'); void c.offsetWidth; c.classList.add('fx'); }
};
</script>
</body>
</html>
