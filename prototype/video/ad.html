<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>NEW Ad</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Vertical ad, 1080 x 1920. Scenes are timed in JS (window.AD) so the same page can be recorded or previewed. */
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--deep); }
.sc { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .5s; overflow: hidden; } .sc.on { opacity: 1; visibility: visible; }
.sc.deep { background: var(--deep); color: #fff; } .sc.ivory { background: var(--bg); color: var(--ink); } .sc.gold { background: var(--accent); color: var(--deep); } .sc.sky { background: #E9EAF7; color: var(--deep); }
.hd { position: absolute; left: 80px; right: 80px; top: 140px; font-family: var(--f-display); font-size: 108px; line-height: 1.02; letter-spacing: -.035em; font-weight: 600; text-wrap: balance; }
.sub { position: absolute; left: 80px; right: 80px; font-size: 40px; line-height: 1.3; font-weight: 500; opacity: .85; }
.hl { color: var(--accent); } .gold .hl, .sky .hl, .ivory .hl { color: var(--brand); }
.sc.on .hd { animation: up .8s .15s both cubic-bezier(.2,.8,.2,1); } .sc.on .sub { animation: up .8s .45s both cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { transform: translateY(420px) rotate(2deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
@keyframes ripple { from { transform: scale(.3); opacity: .5; } to { transform: scale(3.2); opacity: 0; } }
.ph { position: absolute; left: 240px; top: 560px; width: 600px; height: 1300px; border: 16px solid #151858; border-radius: 90px; overflow: hidden; background: #fff; box-shadow: 0 40px 80px rgba(0,0,0,.35); }
.gold .ph, .sky .ph, .ivory .ph { box-shadow: 0 40px 80px rgba(21,24,88,.28); }
.ph img { width: 100%; display: block; } .sc.on .ph { animation: rise 1s .3s both cubic-bezier(.2,.8,.2,1); }
.chip { position: absolute; background: #fff; color: var(--ink); border-radius: 28px; padding: 22px 32px; font-size: 38px; font-weight: 700; box-shadow: 0 20px 50px rgba(21,24,88,.25); display: flex; gap: 14px; align-items: center; }
.sc.on .chip { animation: pop .6s both cubic-bezier(.2,1.3,.4,1); } .chip i { width: 18px; height: 18px; border-radius: 50%; background: var(--ok); flex: none; }
.big { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--f-display); font-weight: 600; letter-spacing: -.03em; }
.ring { position: absolute; border-radius: 50%; border: 6px solid var(--accent); width: 360px; height: 360px; left: 360px; top: 980px; opacity: 0; } .sc.on .ring { animation: ripple 2.6s infinite; } .sc.on .ring:nth-of-type(2) { animation-delay: .9s; } .sc.on .ring:nth-of-type(3) { animation-delay: 1.8s; }
.pay { position: absolute; left: 80px; right: 80px; top: 620px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; } .pay div { background: #fff; border-radius: 40px; padding: 56px 40px; font-size: 54px; font-weight: 700; text-align: center; font-family: var(--f-display); } .sc.on .pay div { animation: pop .6s both cubic-bezier(.2,1.3,.4,1); } .pay div:nth-child(2) { animation-delay: .15s !important; } .pay div:nth-child(3) { animation-delay: .3s !important; } .pay div:nth-child(4) { animation-delay: .45s !important; }
.checks { position: absolute; left: 80px; right: 80px; top: 620px; display: grid; gap: 28px; } .checks div { background: rgba(255,255,255,.1); border-radius: 36px; padding: 44px 48px; font-size: 52px; font-weight: 600; display: flex; gap: 28px; align-items: center; } .checks svg { flex: none; color: var(--accent); } .sc.on .checks div { animation: up .6s both; } .checks div:nth-child(2) { animation-delay: .3s !important; } .checks div:nth-child(3) { animation-delay: .6s !important; } .checks div:nth-child(4) { animation-delay: .9s !important; }
.logo { position: absolute; left: 0; right: 0; top: 560px; text-align: center; font-family: var(--f-display); font-size: 220px; font-weight: 700; letter-spacing: -.05em; } .mk { display: inline-grid; width: 170px; height: 170px; border-radius: 48px; background: var(--accent); color: var(--deep); place-items: center; margin-bottom: 24px; }
.pill { position: absolute; left: 50%; transform: translateX(-50%); background: #fff; color: var(--deep); font-size: 48px; font-weight: 700; padding: 32px 64px; border-radius: 80px; white-space: nowrap; }
.prog { position: absolute; left: 0; bottom: 0; height: 10px; background: var(--accent); width: 0; z-index: 9; }
.brand { position: absolute; left: 80px; top: 44px; font-family: var(--f-display); font-weight: 700; font-size: 36px; z-index: 5; display: flex; gap: 12px; align-items: center; } .brand span { width: 52px; height: 52px; border-radius: 15px; background: var(--accent); color: var(--deep); display: grid; place-items: center; }
</style>
</head>
<body>
<div id="stage"></div><div class="prog" id="prog"></div>
<script src="../shared/icons.js"></script>
<script>
const I = n => icon(n, 64, 2);
const scenes = [
  { d: 5500, cls: 'deep', html: `<div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="hd" style="top:300px;font-size:150px">AC not <span class="hl">cooling?</span></div><div class="sub" style="top:760px;font-size:56px">Dhaka summers do not wait.</div><div class="big" style="top:1180px;color:var(--accent)">${icon('snow', 260, 1.4)}</div>` },
  { d: 8000, cls: 'sky', html: `<div class="hd">Book a technician in <span class="hl">under a minute.</span></div><div class="ph"><img src="shots/customer-booking.png" alt=""></div><div class="chip" style="left:560px;top:1380px"><i></i>Phone verified</div>` },
  { d: 8000, cls: 'gold', html: `<div class="hd">Fixed prices. <span class="hl">No surprises.</span></div><div class="ph"><img src="shots/customer-services.png" alt=""></div><div class="chip" style="left:90px;top:1500px">AC repair ৳1,000</div><div class="chip" style="left:520px;top:1240px">Extra work? You decide.</div>` },
  { d: 9000, cls: 'ivory', html: `<div class="hd">Watch your technician <span class="hl">arrive, live.</span></div><div class="ph"><img src="shots/customer-tracking.png" alt=""></div><div class="chip" style="left:110px;top:1290px"><i></i>Arriving in 11 min</div>` },
  { d: 7000, cls: 'deep', html: `<div class="hd">Every technician is <span class="hl">ID verified.</span></div><div class="checks"><div>${I('checkc')}NID checked</div><div>${I('checkc')}Live selfie matched</div><div>${I('checkc')}Verified by NEW or your vendor</div><div>${I('checkc')}Reviewed by admin only</div></div>` },
  { d: 7500, cls: 'sky', html: `<div class="hd">The job closes only with <span class="hl">your code.</span></div><div class="ph"><img src="shots/customer-code.png" alt=""></div><div class="chip" style="left:100px;top:1500px">${icon('lock', 40, 2.4)} You stay in control</div>` },
  { d: 6000, cls: 'gold', html: `<div class="hd">Pay <span class="hl">your way.</span></div><div class="pay"><div>Cash</div><div>bKash</div><div>Nagad</div><div>Card</div></div><div class="sub" style="top:1180px;font-size:52px;font-weight:600">Pay after the job is done.</div>` },
  { d: 8500, cls: 'ivory', html: `<div class="hd">Shop ACs, bags and <span class="hl">local cosmetics.</span></div><div class="ph"><img src="shots/customer-shop.png" alt=""></div><div class="chip" style="left:80px;top:1230px">20% off installation</div><div class="chip" style="left:470px;top:1480px">1 year repair warranty</div>` },
  { d: 7000, cls: 'deep', html: `<div class="logo"><span class="mk">${icon('snow', 110, 2)}</span><br>NEW</div><div class="sub" style="top:1130px;text-align:center;font-size:60px;font-weight:600">Cooling, serviced and delivered.</div><div class="pill" style="top:1400px">Coming soon on Android</div>` }
];
const stage = document.getElementById('stage'), prog = document.getElementById('prog'), total = scenes.reduce((a, s) => a + s.d, 0);
scenes.forEach((s, i) => { const e = document.createElement('div'); e.className = 'sc ' + s.cls; e.id = 'sc' + i; e.innerHTML = s.html + (i && i < scenes.length - 1 ? `<div class="brand"><span>${icon('snow', 30, 2.2)}</span>NEW</div>` : ''); stage.appendChild(e); });
window.AD = { total, start() { let t = 0; const t0 = performance.now(); scenes.forEach((s, i) => { setTimeout(() => { document.querySelectorAll('.sc').forEach(x => x.classList.remove('on')); document.getElementById('sc' + i).classList.add('on'); }, t); t += s.d; }); const tick = () => { const p = Math.min(1, (performance.now() - t0) / total); prog.style.width = p * 100 + '%'; if (p < 1) requestAnimationFrame(tick); else window.AD.done = true; }; tick(); } };
if (!location.hash.includes('manual')) window.addEventListener('load', () => setTimeout(window.AD.start, 600));
</script>
</body>
</html>
