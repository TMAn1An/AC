<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shital Production Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="shared/base.css">
<style>
html, body { height: auto; }
.w { max-width: 920px; margin: 0 auto; padding: 24px max(20px, env(safe-area-inset-right, 0px)) 80px max(20px, env(safe-area-inset-left, 0px)); }
.bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.prose h1 { font-size: clamp(32px, 5vw, 48px); letter-spacing: -.03em; margin: 28px 0 12px; }
.prose h2 { font-size: 26px; letter-spacing: -.02em; margin: 44px 0 12px; padding-top: 8px; border-top: 1px solid var(--line); }
.prose h3 { font-size: 19px; margin: 26px 0 8px; }
.prose p, .prose li { font-size: 15.5px; color: var(--ink-2); max-width: 74ch; } .prose p { margin: 10px 0; }
.prose ul, .prose ol { padding-left: 22px; margin: 10px 0; display: grid; gap: 6px; }
.prose code { font-family: var(--f-mono); font-size: .88em; background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.prose pre { background: var(--ink); color: #D8E7EB; padding: 14px 16px; border-radius: 12px; overflow-x: auto; } .prose pre code { background: none; border: 0; color: inherit; }
.tw { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; } .prose th { text-align: left; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); background: #FCFAF6; padding: 10px 14px; border-bottom: 1px solid var(--line); } .prose td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); } .prose tr:last-child td { border: 0; }
</style>
</head>
<body>
<div class="w"><div class="bar"><a class="btn btn-s btn-sm" href="index.html">Back to prototype</a><span class="muted">Draft for client review</span></div><article class="prose" id="doc"><p class="muted">Loading the plan.</p></article></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
fetch('plan.md').then(r => r.text()).then(t => {
  const el = document.getElementById('doc'); el.innerHTML = marked.parse(t);
  el.querySelectorAll('table').forEach(tb => { const w = document.createElement('div'); w.className = 'tw'; tb.parentNode.insertBefore(w, tb); w.appendChild(tb); });
}).catch(() => { document.getElementById('doc').textContent = 'The plan could not be loaded. Read docs/PRODUCTION_PLAN.md in the repository.'; });
</script>
</body>
</html>
